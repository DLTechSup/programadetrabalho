name: Gerar instaladores

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
          - name: macOS
            os: macos-latest
            target: --mac
          - name: Linux
            os: ubuntu-22.04
            target: --linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar instalador (Windows, pelo gerar-instalador.bat)
        if: runner.os == 'Windows'
        shell: cmd
        run: gerar-instalador.bat

      - name: Instalar dependências
        if: runner.os != 'Windows'
        run: npm ci

      - name: Baixar ffmpeg e deno
        if: runner.os != 'Windows'
        run: npm run deps

      - name: Compilar o motor yt-dlp (PyInstaller)
        if: runner.os != 'Windows'
        run: npm run engine

      - name: Testar o motor
        if: runner.os != 'Windows'
        run: ./resources/bin/yt-dlp --version

      - name: Gerar interface
        if: runner.os != 'Windows'
        run: npm run build:ui

      - name: Gerar instalador
        if: runner.os != 'Windows'
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Enviar instaladores
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    name: Publicar em Releases
    needs: build
    # Publica ao criar uma tag v* ou a cada push na branch principal (versão do package.json)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler a versão
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Baixar os instaladores gerados
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Sonora ${{ steps.version.outputs.tag }}
          body_path: build/release-notes.md
          make_latest: true
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
