name: Gerar executável (Windows)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: GradeFacil-windows
          path: |
            release/*.exe
          if-no-files-found: error
      - name: Publicar na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', '3.0.1') }}
          target_commitish: ${{ github.sha }}
          name: GradeFácil ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v3.0.1' }}
          files: release/*.exe
