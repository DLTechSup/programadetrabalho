name: Gerar executável (Windows)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: GradeFacil-windows
          path: |
            release/*.exe
          if-no-files-found: error
      - name: Versão do app
        id: ver
        shell: bash
        run: echo "v=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"
      - name: Publicar na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: GradeFácil v${{ steps.ver.outputs.v }}
          files: release/*.exe
