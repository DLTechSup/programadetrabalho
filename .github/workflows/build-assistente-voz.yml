name: Assistente de Voz (testes + executável)

on:
  workflow_dispatch:
  push:
    paths:
      - "assistente-de-voz/**"
      - ".github/workflows/build-assistente-voz.yml"
    tags: ["assistente-v*"]

defaults:
  run:
    working-directory: assistente-de-voz

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: assistente-de-voz/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Teste em Windows real (janelas, programas, volume)
        run: node scripts/smoke-windows.cjs
        continue-on-error: true
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: AssistenteDeVoz
          path: assistente-de-voz/release/*.exe
          if-no-files-found: error
      - name: Publicar na Release (quando for uma tag)
        if: startsWith(github.ref, 'refs/tags/assistente-v')
        uses: softprops/action-gh-release@v2
        with:
          files: assistente-de-voz/release/*.exe
