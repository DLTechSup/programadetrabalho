<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
  #fundo { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.25); }
  #dica {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(20, 20, 24, 0.85); color: #f1f1f1; font: 14px "Segoe UI", sans-serif;
    padding: 8px 16px; border-radius: 8px; white-space: nowrap;
  }
  #selecao {
    position: fixed; display: none; border: 1.5px solid #4da3ff;
    background: rgba(77, 163, 255, 0.15); box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.25);
  }
</style>
</head>
<body>
  <div id="fundo"></div>
  <div id="dica">Clique e arraste para selecionar a área • clique direito ou Esc para cancelar</div>
  <div id="selecao"></div>
  <script>
    const dica = document.getElementById("dica");
    const sel = document.getElementById("selecao");
    const fundo = document.getElementById("fundo");
    let inicio = null;

    window.overlay.aoIniciar(({ x, y }) => {
      inicio = { x, y };
      dica.style.display = "none";
      fundo.style.background = "transparent";
      sel.style.display = "block";
      sel.style.left = x + "px";
      sel.style.top = y + "px";
      sel.style.width = "0px";
      sel.style.height = "0px";
    });

    window.overlay.aoMover(({ x, y }) => {
      if (!inicio) return;
      const esq = Math.min(inicio.x, x);
      const topo = Math.min(inicio.y, y);
      sel.style.left = esq + "px";
      sel.style.top = topo + "px";
      sel.style.width = Math.abs(x - inicio.x) + "px";
      sel.style.height = Math.abs(y - inicio.y) + "px";
    });
  </script>
</body>
</html>
